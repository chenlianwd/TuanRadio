<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Radio Live2D</title>
  <style>
    html, body {
      overflow: hidden;
      margin: 0;
    }
    html {
      overscroll-behavior-x: none;
      touch-action: none;
    }
    body {
      display: flex;
      flex-wrap: wrap;
      background: #121212;
    }
    body > canvas:only-child {
      width: 100vw;
      height: 100vh;
    }
    #lip-status {
      position: fixed;
      top: 10px;
      left: 10px;
      color: #1ED760;
      font-family: sans-serif;
      font-size: 11px;
      z-index: 100;
      background: rgba(0,0,0,0.5);
      padding: 4px 8px;
      border-radius: 4px;
    }
  </style>
  <script src="./Core/live2dcubismcore.js"></script>
  <script type="module" crossorigin src="/assets/index-B7oLzHoz.js"></script>
</head>
<body>
<div id="lip-status">Live2D 加载中...</div>
<script>
// Lip sync integration with the Live2D demo app
(function() {
  const status = document.getElementById('lip-status');

  // Signal that lip sync is ready (demo app should call this when ready)
  window.onLive2DReady = function() {
    status.textContent = 'Ready';
    setTimeout(() => status.style.display = 'none', 2000);
  };

  // Lip sync: called from C# with spectrum data [16 bands]
  // The demo app doesn't expose direct model control, but we track talking state
  let isTalking = false;
  let mouthOpenness = 0;
  const LIP_SMOOTH = 0.2;

  window.updateLipSync = function(data) {
    if (!data || data.length === 0) return;

    // Calculate average level
    let sum = 0;
    for (let i = 0; i < data.length; i++) sum += data[i];
    const avgLevel = sum / data.length;

    // High frequencies indicate speech
    let highSum = 0;
    for (let i = Math.floor(data.length / 2); i < data.length; i++) highSum += data[i];
    const highAvg = highSum / Math.max(1, data.length / 2);

    const target = Math.min(1.0, avgLevel * 2.5 + highAvg * 3.0);
    mouthOpenness += (target - mouthOpenness) * LIP_SMOOTH;

    if (mouthOpenness > 0.25 && !isTalking) {
      isTalking = true;
      status.textContent = 'Talking...';
      status.style.display = 'block';
    } else if (mouthOpenness < 0.08 && isTalking) {
      isTalking = false;
      status.textContent = 'Ready';
      setTimeout(() => { status.style.display = 'none'; }, 1000);
    }
  };

  window.setExpression = function(name) {
    console.log('Expression:', name);
  };

  window.playMotion = function(name) {
    console.log('Motion:', name);
  };

  window.loadCharacter = function(name) {
    status.textContent = 'Loading ' + name;
    status.style.display = 'block';
  };

  // Hide status after timeout
  setTimeout(() => { status.style.display = 'none'; }, 5000);

  console.log('Lip sync bridge ready');
})();
</script>
</body>
</html>
