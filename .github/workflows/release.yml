name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Velopack CLI (vpk)
        run: dotnet tool install -g vpk

      - name: Resolve version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          "version=$v" >> $env:GITHUB_OUTPUT

      # Test gate before packaging: a tag must never ship an untested build.
      - name: Test gate (slim core)
        run: dotnet test AIRadio.Desktop.Tests/AIRadio.Desktop.Tests/AIRadio.Desktop.Tests.csproj -c Release -p:TuanRadioEnableNodeProviders=false

      # Full variant (npm ci for both Node proxies runs via csproj targets).
      - name: Package (full providers, win-x64, self-contained + Velopack installer)
        shell: pwsh
        run: ./tools/publish.ps1 -Version ${{ steps.ver.outputs.version }} -PackInstaller

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $notes = @'
          TuanRadio v__VERSION__ — 复古 AI 电台播放器（Windows 桌面）

          ## 下载安装
          - **一键安装版（推荐）**：下载 `TuanRadio-win-Setup.exe` 双击即可无感安装（无需管理员权限，自动创建快捷方式，支持在「设置 → 外观与通用 → 版本与更新」中应用内检查并一键升级）。
          - **绿色免安装版**：下载 `TuanRadio-v__VERSION__-win-x64.zip`，解压到任意目录，运行 `TuanRadio-v__VERSION__-win-x64\AIRadio.exe` 即可。
          - 最低系统要求：Windows 10 2004（内部版本 19041）及以上，x64。
          - 文件校验（可选）：`certutil -hashfile TuanRadio-win-Setup.exe SHA256` 或 `certutil -hashfile TuanRadio-v__VERSION__-win-x64.zip SHA256`，与随附的 `.sha256` 文件比对。
          - 应用未签名，首次运行 SmartScreen 可能提示「Windows 已保护你的电脑」：点「更多信息」→「仍要运行」。

          ## 运行依赖与首跑说明
          - 正式发布包已内置经 SHA256 校验的 Node.js 运行时，网易/酷狗本地代理开箱即用，无需额外下载。
          - Whisper 语音识别模型（约 140MB，来自 huggingface.co）：仅「按住说话」首次使用时下载；该域名在部分网络不可达，失败只影响语音点歌、不影响其他功能。也可手动获取 ggml-base.bin 放到 `%LOCALAPPDATA%\AIRadio\models\ggml-base.bin`。
          - Edge TTS 人声与天气服务需联网。
          - AI DJ 对话与智能推荐需在「设置 → AI 服务」配置任意 OpenAI/Anthropic 兼容 API（可选）：不配置时应用照常可用，DJ 串场回退固定模板、推荐走本地规则。

          ## 主要功能
          复古收音机界面 · AI DJ 串场与对话 · 全球网络电台与自定义流导入（M3U/M3U8/PLS）· 睡眠定时与深夜伴眠模式 · 多音源（本地曲库/网易云/酷狗/Audius/OpenSubsonic/YouTube）· 歌词模式 · 语音点歌 · 长期收听画像 · 深浅主题×四套配色 · 耳机媒体键/系统媒体面板（SMTC）· 简洁播放模式与系统托盘 · 应用内检查更新

          ## 许可证
          GPL-3.0-only，随包附 LICENSE 与 THIRD-PARTY-NOTICES.md（含第三方组件许可声明与 LGPL-2.1 全文）。
          '@.Replace('__VERSION__', $v)
          $tag = "${{ github.ref_name }}"
          $assets = @(
            "release/velopack/TuanRadio-win-Setup.exe",
            "release/velopack/TuanRadio-win-Setup.exe.sha256",
            "release/TuanRadio-v$v-win-x64.zip",
            "release/TuanRadio-v$v-win-x64.zip.sha256",
            "release/velopack/releases.win.json",
            "release/velopack/TuanRadio-$v-full.nupkg"
          )
          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            gh release edit $tag --title "TuanRadio v$v" --notes $notes
          } else {
            gh release create $tag @assets --title "TuanRadio v$v" --notes $notes
          }
